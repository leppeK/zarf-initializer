name: Docker

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Zarf version from Dockerfile
        id: zarf_version
        run: |
          VERSION=$(grep -oP 'ARG ZARF_VERSION="\K[^"]+' Dockerfile)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.2.4"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.zarf_version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Create git tag
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const tag = '${{ steps.zarf_version.outputs.version }}';
            try {
              await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}` });
              console.log(`Tag ${tag} already exists, skipping.`);
            } catch (e) {
              await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `refs/tags/${tag}`, sha: context.sha });
              console.log(`Created tag ${tag}`);
            }

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.zarf_version.outputs.version }}';
            const image = '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}';

            // Fetch Zarf release notes
            let zarfBody = '';
            try {
              const zarfRelease = await github.rest.repos.getReleaseByTag({
                owner: 'defenseunicorns',
                repo: 'zarf',
                tag,
              });
              zarfBody = zarfRelease.data.body ?? '';
            } catch (e) {
              console.log(`Could not fetch Zarf release notes: ${e.message}`);
            }

            const body = [
              `## Zarf Initializer ${tag}`,
              ``,
              `Tracking [Zarf ${tag}](https://github.com/defenseunicorns/zarf/releases/tag/${tag}).`,
              ``,
              `### Image`,
              `\`\`\``,
              `docker pull ${image}:${tag}`,
              `\`\`\``,
              ``,
              `---`,
              ``,
              `### Zarf ${tag} Release Notes`,
              ``,
              zarfBody,
            ].join('\n');

            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                body,
                draft: false,
                prerelease: false,
              });
              console.log(`Created release ${tag}`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Release ${tag} already exists, skipping.`);
              } else {
                throw e;
              }
            }
